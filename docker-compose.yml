services:
  engine-api:
    build:
      context: ./services
    environment:
      GROVE_ROOT: /repo
      GROVE_LEDGER_DIR: /repo/ledger
    ports:
      - "8080:8080"
    volumes:
      - .:/repo

  ui:
    build:
      context: ./ui
    ports:
      - "5173:80"
    depends_on:
      - engine-api

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: grove
      POSTGRES_PASSWORD: grove
      POSTGRES_DB: grove
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: grove
      MINIO_ROOT_PASSWORD: grovepassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
